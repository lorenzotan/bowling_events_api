version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Python 3.14; patch releases still come through.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
