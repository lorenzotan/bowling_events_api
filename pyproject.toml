[project]
name = "bowl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.150.0",
    "psycopg2>=2.9.13",
    "python-decouple>=3.8",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import grouping/ordering — PEP 8 "Imports")
    "N",    # pep8-naming (PEP 8 "Naming Conventions")
    "B",    # flake8-bugbear (common bug-prone patterns)
    "SIM",  # flake8-simplify (needless complexity)
    "C90",  # mccabe complexity (long method / large class)
    "PLR",  # pylint refactor (long parameter list, magic values, ...)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Asserting literal expected values is idiomatic in tests, not a smell.
"tests/*" = ["PLR2004"]
